; M5Stack StopWatch (SKU: C152 / ESP32-S3R8, 16MB Flash + 8MB OPI PSRAM)
;
; memory_type = qio_opi は必須。OPI PSRAM が無効だと M5GFX が直接描画に
; フォールバックし、奇数座標を原点にした描画が崩れる。
[env:stopwatch]
platform = espressif32 @ 6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 1500000

board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1

; StopWatch の自動判別は M5GFX 0.2.26 以降、M5Unified 0.2.21 以降で入った。
lib_deps =
	m5stack/M5Unified @ ^0.2.21
	bblanchon/ArduinoJson @ ^7.2.0
